<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CORTEX Admin Dashboard — Context-Aware Authentication Threat Intelligence System">
    <title>{% block title %}CORTEX Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="/dashboard/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="layout">
        <!-- Sidebar Navigation -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">◆</span>
                    <span class="logo-text">CORTEX</span>
                </div>
                <span class="logo-sub">Threat Intelligence</span>
            </div>

            <ul class="nav-links">
                <li>
                    <a href="/admin?token={{ request.args.get('token', '') }}" class="nav-link {% if request.path == '/admin' %}active{% endif %}" id="nav-overview">
                        <span class="nav-icon">⊞</span>
                        <span>Overview</span>
                    </a>
                </li>
                <li>
                    <a href="/admin/users?token={{ request.args.get('token', '') }}" class="nav-link {% if '/users' in request.path %}active{% endif %}" id="nav-users">
                        <span class="nav-icon">⊙</span>
                        <span>Users</span>
                    </a>
                </li>
                <li>
                    <a href="/admin/logs?token={{ request.args.get('token', '') }}" class="nav-link {% if '/logs' in request.path %}active{% endif %}" id="nav-logs">
                        <span class="nav-icon">⊟</span>
                        <span>Logs</span>
                    </a>
                </li>
                <li>
                    <a href="/admin/threats?token={{ request.args.get('token', '') }}" class="nav-link {% if '/threats' in request.path %}active{% endif %}" id="nav-threats">
                        <span class="nav-icon">⚠</span>
                        <span>Threats</span>
                    </a>
                </li>
                <li>
                    <a href="/admin/system?token={{ request.args.get('token', '') }}" class="nav-link {% if '/system' in request.path %}active{% endif %}" id="nav-system">
                        <span class="nav-icon">⊕</span>
                        <span>System</span>
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <div class="system-status">
                    <span class="status-dot online"></span>
                    <span class="status-text">System Online</span>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="page-title">
                    <h1 id="page-heading">{% block heading %}Dashboard{% endblock %}</h1>
                    <span class="breadcrumb">{% block breadcrumb %}CORTEX / Overview{% endblock %}</span>
                </div>
                <div class="header-actions">
                    <span class="live-indicator" id="live-indicator">
                        <span class="pulse-dot"></span>
                        LIVE
                    </span>
                    <span class="timestamp" id="header-timestamp"></span>
                </div>
            </header>

            <div class="content-area" id="content-area">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script src="/dashboard/static/dashboard.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
